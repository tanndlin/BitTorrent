[package]
name = "bittorrent"
version = "0.1.0"
description = "A BitTorrent client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.7"
sha1 = "0.10.6"
glob = "0.3.3"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["blocking"] }
urlencoding = "2.1.3"
hex = "0.4.3"
dotenvy = "0.15.7"
rayon = "1.12.0"
